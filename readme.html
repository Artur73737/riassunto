### 1. Principi Fondamentali e Limiti Dimensionali della Cellula

Tutte le cellule, indipendentemente dall'organizzazione strutturale, condividono quattro elementi essenziali:
* **Membrana plasmatica**: struttura a **mosaico fluido** costituita da un doppio strato di fosfolipidi, colesterolo, proteine integrali e periferiche, e carboidrati (glicolipidi e glicoproteine). Mantiene costanti le condizioni chimico-fisiche interne ed agisce come barriera semipermeabile.
* **Citoplasma**: materiale semifluido composto dal **citosol** (fase liquida contenente acqua, ioni e micromolecole) e da particelle insolubili sospese.
* **DNA**: materiale genetico che contiene le informazioni per la sintesi proteica e il metabolismo.
* **Ribosomi**: complessi di RNA e proteine responsabili della sintesi proteica.

#### Il Rapporto Superficie/Volume
La dimensione cellulare è strettamente limitata da vincoli geometrici e fisici:
* **Volume**: determina la quantità di attività chimica svolta dalla cellula nell'unità di tempo.
* **Superficie estesa**: determina la quantità di sostanze e nutrienti che la cellula può scambiare con l'ambiente esterno e la velocità di smaltimento dei rifiuti.
* **Vincolo geometrico**: all'aumentare del raggio/dimensione, il volume cresce in modo proporzionale al cubo, mentre la superficie cresce solo al quadrato. Di conseguenza, il rapporto superficie/volume diminuisce significativamente al crescere della cellula.
* **Implicazione biologica**: gli organismi complessi sono **pluricellulari** poiché molte cellule piccole garantiscono un elevato rapporto superficie/volume e distanze di diffusione ridotte, necessarie al sostentamento vitale.
* **Eccezioni dimensionali**: uova di uccello, neuroni e i protozoi giganti abissali (*Xenophyophores*), organismi unicellulari che superano i 10 cm grazie alla fagocitosi e all'adattamento ad ambienti abissali.

---

### 2. La Cellula Procariotica: Struttura e Specializzazioni

I procarioti sono strutturalmente più semplici degli eucarioti ma funzionalmente complessi.

#### Struttura di Base
1. **Membrana plasmatica**: regola il passaggio delle molecole e racchiude il citoplasma.
2. **Citoplasma e Citosol**: ambiente dinamico privo di organuli delimitati da membrana.
3. **Nucleoide**: regione centrale non delimitata da membrana che ospita un'unica molecola di **DNA circolare**.
4. **Ribosomi procariotici**: aggregati sferici di 25 nm, più piccoli di quelli eucariotici, diffusi nel citoplasma.

#### Strutture Specializzate Procariotiche
* **Parete cellulare**: posta esternamente alla membrana, è costituita da **peptidoglicano** che conferisce forma e sostegno alla cellula.
* **Capsula**: strato gelatinoso di polisaccaridi esterno alla parete; protegge la cellula dall'essiccamento e dagli attacchi del sistema immunitario dell'ospite.
* **Membrane interne**: invaginazioni della membrana plasmatica necessarie per ospitare complessi molecolari deputati alla fotosintesi o alla respirazione cellulare.
* **Flagelli procariotici**: appendici filiformi il cui movimento rotatorio permette la propulsione cellulare.
* **Pili**: strutture proteiche più corte e numerose usate per l'adesione alle superfici o per il contatto intercellulare.
* **Citoscheletro procariotico**: filamenti proteici coinvolti nel mantenimento della forma e nella divisione cellulare.

---

### 3. La Cellula Eucariotica e la Compartimentazione

Caratteristica distintiva della cellula eucariotica è la **compartimentazione**: la presenza di organuli interni delimitati da membrane proprie crea microambienti specifici in cui reazioni biochimiche incompatibili o complesse possono svolgersi contemporaneamente con elevata efficienza.

#### Confronto tra Cellula Animale e Vegetale
* **Organuli esclusivi della cellula vegetale**: **parete cellulare** (cellulosa), **cloroplasti** (fotosintesi) e un grande **vacuolo centrale** (riserva d'acqua e sostegno osmotico).
* **Organuli esclusivi della cellula animale**: **centrioli** e **lisosomi**.
* **Organuli comuni**: Nucleo, Reticolo Endoplasmatico (RER e REL), Apparato di Golgi, Mitocondri, Perossisomi, Citoscheletro, Ribosomi e Membrana plasmatica.

---

### 4. Il Nucleo, l'Informazione Genetica e i Ribosomi

#### Il Nucleo
Ha un diametro di circa 5 micrometri ed è il centro di controllo genetico della cellula:
* **Involucro nucleare**: doppia membrana perforata da **pori nucleari** (circa 9 nm), che selezionano il traffico di macromolecole.
* **Cromatina e Cromosomi**: il DNA si associa a proteine formando la **cromatina**. Durante la divisione cellulare, la cromatina si condensa in strutture chiamate **cromosomi**.
* **Nucleolo**: regione densa in cui viene sintetizzato l'RNA ribosomiale (rRNA) e vengono assemblate le sub-unità dei ribosomi.

#### I Ribosomi
Siti della sintesi proteica, costituiti da due sub-unità (rRNA e proteine):
* **Ribosomi liberi**: sospesi nel citosol; sintetizzano proteine destinate a rimanere nel citoplasma.
* **Ribosomi legati**: ancorati al RER o all'involucro nucleare; sintetizzano proteine destinate alle membrane, ai lisosomi o alla secrezione.

---

### 5. Il Sistema delle Membrane Interne

Comprende organuli interconnessi direttamente o tramite vescicole di trasporto.

```
[Involucro Nucleare] -> [RER] -> (Vescicole) -> [Golgi (cis -> trans)] -> [Membrana / Lisosomi]
```

#### Reticolo Endoplasmatico Ruvido (RER)
* **Struttura**: rete di tubuli e sacculi appiattiti costellati di ribosomi sul lato citosolico.
* **Funzioni**: accoglie le catene polipeptidiche nel proprio lume, ne favorisce il corretto ripiegamento e apporta modificazioni chimiche (es. la **glicosilazione**). Confeziona le proteine in vescicole di trasporto dirette al Golgi.

#### Reticolo Endoplasmatico Liscio (REL)
* **Struttura**: privo di ribosomi, prevalentemente tubulare.
* **Funzioni**:
  1. **Sintesi dei lipidi**: acidi grassi, fosfolipidi e steroidi.
  2. **Detossificazione**: trasformazione di farmaci, pesticidi e sostanze tossiche (sviluppato negli epatociti).
  3. **Idrolisi del glicogeno**: demolizione del glicogeno in glucosio.
  4. **Accumulo di ioni Calcio**: fondamentale nei tessuti muscolari per la contrazione.

#### Apparato di Golgi
Scoperto da Camillo Golgi, è formato da cisterne appiattite non comunicanti e relative vescicole. Presenta tre regioni:
1. **Regione cis** (ingresso): rivolta verso il RER, riceve le vescicole di trasporto.
2. **Regione mediana**: modifica ulteriormente proteine e lipidi.
3. **Regione trans** (uscita): smista ed impacchetta i prodotti finiti in vescicole destinate alla secrezione, alla membrana plasmatica o ai lisosomi. Sintetizza anche polisaccaridi per la parete vegetale.

#### Lisosomi
Vescicole prodotte dal Golgi contenenti **enzimi idrolitici acidi**:
* **Fagocitosi**: si fondono con i fagosomi per digerire sostanze nutritive o batteri (es. nei globuli bianchi).
* **Autofagia**: distruggono e riciclano organuli danneggiati o invecchiati.

#### Perossisomi e Vacuoli
* **Perossisomi**: organuli sferici con enzimi che decompongono il perossido di idrogeno, sottoprodotto tossico del metabolismo.
* **Vacuoli** (prevalenti in piante e protisti):
  * **Turgore cellulare**: accumulano acqua fornendo sostegno alla parete vegetale.
  * **Accumulo e Riserva**: sostanze di riserva, pigmenti o sostanze di scarto.

---

### 6. Organuli Energetici e Teoria Endosimbiotica

#### Cloroplasti
Sede della **fotosintesi clorofilliana** che trasforma l'energia luminosa in energia chimica (glucosio):
* **Struttura**: doppia membrana. All'interno lo **stroma**, con membrane a sacchetto chiamate **tilacoidi**, impilati a formare i **grana**.
* Contengono pigmenti come la **clorofilla**, DNA circolare e ribosomi propri.

#### Mitocondri
Sede della **respirazione cellulare**, che converte i nutrienti in molecole di **ATP**:
* **Membrana esterna**: liscia e con funzione protettiva.
* **Membrana interna**: ripiegata a formare le **creste mitocondriali**, che ospitano la catena di trasporto degli elettroni e l'ATP sintasi.
* **Matrice mitocondriale**: soluzione fluida interna con enzimi, DNA circolare e ribosomi propri.

#### Teoria Endosimbiotica
Proposta da Lynn Margulis: mitocondri e cloroplasti derivano da antichi procarioti ingeriti da cellule eucariote ancestrali, poi divenuti simbionti.
* **Prove a sostegno**: doppia membrana, DNA circolare proprio, ribosomi simili a quelli batterici e riproduzione autonoma per scissione.

---

### 7. Il Citoscheletro e le Strutture Motili

Il citoscheletro eucariotico è una rete di tre tipi di filamenti proteici che mantengono la forma cellulare, ancorano gli organuli e consentono il movimento.

| Filamento | Diametro | Componenti Proteiche | Funzioni Principali |
| :--- | :--- | :--- | :--- |
| **Microfilamenti** | ~7 nm | Monomeri di **Actina** | Forma cellulare, contrazione muscolare (con miosina), pseudopodi e citodieresi. |
| **Filamenti Intermedi** | 8-12 nm | Proteine fibrose | Resistenza meccanica, ancoraggio del nucleo e degli organuli, desmosomi. |
| **Microtubuli** | ~25 nm | Dimeri di **Tubulina** | Scheletro rigido, binari per i movimenti cellulari, fuso mitotico, ciglia e flagelli. |

#### Ciglia e Flagelli Eucariotici
Appendici motili costituite internamente da microtubuli:
* **Ciglia**: brevi (circa 5 micrometri), molto numerose; muovono il fluido circostante.
* **Flagelli**: lunghi (100-200 micrometri), singoli o in coppia; propulsione della cellula.

<script>
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|\W)\*(.+?)\*/g, "$1<em>$2</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function render(md) {
  var lines = md.split(/\r?\n/), html = "", i = 0, inList = null, inTable = false;
  function closeList() { if (inList) { html += inList === "ul" ? "</ul>" : "</ol>"; inList = null; } }
  while (i < lines.length) {
    var line = lines[i];
    var t = line.trim();
    if (/^```/.test(t)) { closeList(); html += "<pre><code>"; i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) { html += esc(lines[i]) + "\n"; i++; }
      html += "</code></pre>"; i++; continue; }
    if (/^---+$/.test(t)) { closeList(); html += "<hr>"; i++; continue; }
    if (/^####\s+/.test(t)) { closeList(); html += "<h4>" + inline(t.replace(/^####\s+/, "")) + "</h4>"; i++; continue; }
    if (/^###\s+/.test(t)) { closeList(); html += "<h2>" + inline(t.replace(/^###\s+/, "")) + "</h2>"; i++; continue; }
    if (/^\|.+\|$/.test(t) && i + 1 < lines.length && /^\|[\s:\-|]+\|$/.test(lines[i+1].trim())) {
      closeList();
      var heads = t.split("|").filter(function(c){return c.trim() !== "";});
      html += "<table><thead><tr>" + heads.map(function(h){return "<th>" + inline(h.trim()) + "</th>";}).join("") + "</tr></thead><tbody>";
      i += 2; inTable = true;
      while (i < lines.length && /^\|.+\|$/.test(lines[i].trim())) {
        var cells = lines[i].trim().split("|").filter(function(c){return c.trim() !== "";});
        html += "<tr>" + cells.map(function(c){return "<td>" + inline(c.trim()) + "</td>";}).join("") + "</tr>"; i++;
      }
      html += "</tbody></table>"; inTable = false; continue; }
    var mOrd = t.match(/^(\d+)\.\s+(.*)/);
    if (/^[*\-]\s+/.test(t) || mOrd) {
      var type = mOrd ? "ol" : "ul";
      var text = mOrd ? mOrd[2] : t.replace(/^[*\-]\s+/, "");
      if (inList !== type) { closeList(); html += type === "ul" ? "<ul>" : "<ol>"; inList = type; }
      html += "<li>" + inline(text) + "</li>"; i++; continue; }
    if (t === "") { closeList(); i++; continue; }
    closeList(); html += "<p>" + inline(t) + "</p>"; i++;
  }
  closeList();
  return html;
}
function show(md, note) {
  document.getElementById("content").innerHTML = render(md);
  document.getElementById("source-note").textContent = note;
}
var fallback = document.getElementById("readme-fallback").textContent.trim();
fetch("README.md").then(function(r) { if (!r.ok) throw 0; return r.text(); })
  .then(function(t) { show(t, "Sorgente: README.md"); })
  .catch(function() { show(fallback, "Sorgente: copia incorporata (README.md non caricato)"); });
</script>
